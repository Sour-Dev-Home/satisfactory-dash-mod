name: linux-build

# L1 of the Linux server plan (docs/plans/2026-11-06-linux-server-build.md): build the core mod for the Windows and
# Linux dedicated servers on the owner's self-hosted `ue` runner, which has UE's Linux cross-compile toolchain
# (LINUX_MULTIARCH_ROOT, docs/runner.md "Linux toolchain"), and check both archives. This is a public repository, so
# this workflow must never trigger from a pull request: fork code would run on the owner's PC.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mod/**", "scripts/build-mod.ps1", "harness/src/check-build.ts", ".github/workflows/linux-build.yml"]

permissions:
  contents: read

concurrency:
  group: ue-runner
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, windows, ue]
    environment: ue-runner
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
        working-directory: harness
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: harness/.node-version
      - run: npm ci
      - run: npm run harness -- check-api
      - name: The Linux toolchain is installed
        run: |
          $root = [Environment]::GetEnvironmentVariable('LINUX_MULTIARCH_ROOT', 'Machine')
          if (-not $root -or -not (Test-Path (Join-Path $root 'x86_64-unknown-linux-gnu\bin\clang++.exe'))) { throw "LINUX_MULTIARCH_ROOT is unset or has no clang++ (docs/runner.md, Linux toolchain)" }
          Get-Content (Join-Path $root 'ToolchainVersion.txt')
      - run: npm run harness -- build-mod --out "$env:RUNNER_TEMP/linux-build" --platforms Win64+Linux
      - if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SatisDashAgent-LinuxServer-${{ github.run_id }}
          path: ${{ runner.temp }}/linux-build/LinuxServer
          if-no-files-found: error
          retention-days: 14
