name: core-run

# Runs the core mod's runs (Plan 2B) on the owner's self-hosted `ue` runner (docs/runner.md, "Core runs"). This is a
# public repository, so this workflow must never trigger from a pull request or a push: it is dispatched by hand
# only. harness/test/workflows.test.ts fails CI if a trigger is added, an action is unpinned or a job leaves the
# ue-runner environment. The options are the runs the harness drives so far; a run that needs the backend host (enrol,
# revoke, command, outage, tick-cost, tick-cost-native, s3-census, soak-native) refuses unless the owner has started it in their own session
# first (docs/runner.md, "The backend host"). No run needs anything but the runner config's own keys (R7 step 4 retired the
# FRM-based runs and config keys).
on:
  workflow_dispatch:
    inputs:
      run:
        description: Core run
        required: true
        type: choice
        options: [http-probe, enrol, revoke, command, outage, tick-cost, manual, tick-cost-native, s3-census, soak-native]
      # The test server: the Windows one (FactoryServer.exe), or the Linux one in Docker (docker/linux-server; plan
      # 2026-11-06-linux-server-build, Task 7). Linux takes its runner config from the runner's SATIS_HARNESS_CONFIG_LINUX.
      host:
        description: Test server
        required: false
        type: choice
        options: [windows, linux]
        default: windows

permissions:
  contents: read

concurrency:
  group: ue-runner
  cancel-in-progress: false

jobs:
  run:
    runs-on: [self-hosted, windows, ue]
    environment: ue-runner
    # 90 minutes for every run; the 16 h soak-native needs its window plus the boots (18 h; a self-hosted job may run 5 days).
    timeout-minutes: ${{ inputs.run == 'soak-native' && 1080 || 90 }}
    defaults:
      run:
        shell: pwsh
        working-directory: harness
    env:
      RUN: ${{ inputs.run }}
      HOST_KIND: ${{ inputs.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: harness/.node-version
      - run: npm ci
      - run: |
          if ($env:HOST_KIND -eq 'linux') {
            if (-not $env:SATIS_HARNESS_CONFIG_LINUX) { throw "SATIS_HARNESS_CONFIG_LINUX is not set on the runner (docs/runner.md, Core runs on the Linux test server)" }
            $env:SATIS_HARNESS_CONFIG = $env:SATIS_HARNESS_CONFIG_LINUX
          }
          npm run harness -- core-run $env:RUN --out "$env:RUNNER_TEMP/core-run"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-run-${{ inputs.run }}-${{ inputs.host || 'windows' }}-${{ github.run_id }}
          path: ${{ runner.temp }}/core-run
          if-no-files-found: warn
          retention-days: 90
