name: CI

# This repository has no build (UE builds run on the owner's own PC, ADR-0039); the one check that runs
# here, on every push and PR, is the PII / hardcoded-local-path scan, matching satisfactory-dash's own
# (Sour-Dev-Home/satisfactory-dash, .github/workflows/ci.yml). See that repo's ADR-0039 for context.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for PII or hardcoded local paths
        # The identifiers to look for live in the org-level PII_PATTERNS secret (one fixed string
        # per line), not in this public file, and only file:line is printed. It must be a secret,
        # never a variable: Actions prints a step's `env:` block at the top of its log, and only
        # secrets are masked there. Fork and Dependabot runs may not get it; see the warning below.
        env:
          PII_PATTERNS: ${{ secrets.PII_PATTERNS }}
        run: |
          PATTERNS=$(mktemp)
          printf '%s\n' "$PII_PATTERNS" | sed '/^[[:space:]]*$/d' > "$PATTERNS"
          printf '%s\n' 'C:\Users' 'C:/Users' '/home/' '/Users/' >> "$PATTERNS"
          if [ -z "$PII_PATTERNS" ]; then
            echo "::warning::PII_PATTERNS secret is not available (e.g. a fork PR); only checking for local paths."
          fi
          # The owner's real name appears in exactly one file, NOTICE (mirrors satisfactory-dash's own
          # LICENSE exception, ADR-0018, adapted here because this repo's LICENSE must stay
          # byte-identical to canonical GPLv3 text for GitHub's license detector). README.md's Licence
          # section points to NOTICE and carries no name itself. Only .github/, CLAUDE.md-style docs,
          # and NOTICE are excluded.
          HITS=$(git ls-files | grep -vE '^(\.github/|.*CLAUDE\.md$|NOTICE$)' | xargs -r grep -H -n -iF -f "$PATTERNS" | cut -d: -f1,2 || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::Possible PII or hardcoded-path leak at the file:line locations above."
            exit 1
          fi
